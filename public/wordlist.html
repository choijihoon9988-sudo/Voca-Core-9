<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voca-Core 9: 전체 단어 목록 (빈출 순)</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --background-color: #f4f4f9;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--dark-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

       .app-container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--primary-color);
            margin-bottom: 0.25rem;
        }
         header p {
             color: var(--secondary-color);
             font-size: 0.9rem;
         }

        /* 표 스타일 */
       .word-table-container {
            width: 100%;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #dee2e6;
            padding: 0.75rem;
            text-align: left;
            font-size: 0.95rem;
            vertical-align: top;
        }

        th {
            background-color: var(--light-color);
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        th:first-child, td:first-child {
            width: 10%;
            text-align: center;
            color: var(--secondary-color);
        }
        th:nth-child(2), td:nth-child(2) {
            width: 40%;
            color: var(--primary-color);
            font-weight: 500;
        }
        th:last-child, td:last-child {
            width: 50%;
            color: var(--dark-color);
        }


         tbody tr:nth-child(odd) {
             background-color: #f8f9fa;
         }
         tbody tr:hover {
             background-color: #e9ecef;
         }


       .navigation-button {
            display: inline-block;
            width: auto;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: var(--success-color);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s ease;
            /* (수정) margin-top은 .button-container의 gap으로 대체 */
        }
       .navigation-button:hover {
            background-color: #218838;
        }
        
        /* (추가) PDF 자료실 버튼용 스타일 */
       .navigation-button.secondary {
            background-color: var(--primary-color);
       }
       .navigation-button.secondary:hover {
            background-color: #0056b3; /* --primary-color의 어두운 버전 */
       }

       .loading-message {
           text-align: center;
           color: var(--secondary-color);
           padding: 2rem;
       }
        
       /* (수정) 버튼 컨테이너 스타일 */
       .button-container {
           display: flex;
           flex-wrap: wrap;
           justify-content: center;
           gap: 1rem;
           margin-top: 1.5rem; /* 버튼과 테이블 사이 간격 */
       }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Voca-Core 9: 전체 단어 목록 (빈출 순)</h1>
            <p>총 45개의 스페인어 단어 (빈출도 순서)</p>
        </header>

        <div class="word-table-container">
            <table>
                <thead>
                    <tr>
                        <th>순번</th>
                        <th>스페인어 (Lemma)</th>
                        <th>한국어 뜻</th>
                    </tr>
                </thead>
                <tbody id="word-table-body">
                    <tr>
                        <td colspan="3" class="loading-message">단어 목록 로딩 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="button-container">
             <a href="pdf_library.html" class="navigation-button secondary">&larr; PDF 자료실 가기</a>
             <a href="index.html" class="navigation-button">Voca-Core 9 빈출 순서 학습 시작하기 &rarr;</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.getElementById('word-table-body');
            let allWords = [];

            try {
                // 스페인어.txt 파일 로드
                const response = await fetch('스페인어.txt');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                allWords = await response.json();

                // 데이터 자체가 rank 순서이므로 별도 정렬 불필요
                // allWords.sort((a, b) => a.rank - b.rank);

                renderWordTable();

            } catch (error) {
                console.error("단어 데이터 로딩 실패:", error);
                tableBody.innerHTML = `<tr><td colspan="3" class="loading-message">단어 파일을 불러오는 데 실패했습니다.<br>'스페인어.txt' 파일이 같은 폴더에 있는지 확인해주세요.</td></tr>`;
            }

            // 단어 테이블을 화면에 렌더링하는 함수
            function renderWordTable() {
                tableBody.innerHTML = '';
                if (allWords.length === 0) {
                     tableBody.innerHTML = `<tr><td colspan="3" class="loading-message">표시할 단어가 없습니다.</td></tr>`;
                     return;
                }

                allWords.forEach((word, index) => { // index를 순번으로 사용
                    const tableRow = document.createElement('tr');

                    // 순번 셀 추가
                    const rankCell = document.createElement('td');
                    rankCell.textContent = index + 1;
                    rankCell.style.textAlign = 'center';

                    const lemmaCell = document.createElement('td');
                    lemmaCell.textContent = word.lemma;

                    const meaningCell = document.createElement('td');
                    meaningCell.textContent = word.korean_meaning;

                    tableRow.appendChild(rankCell);
                    tableRow.appendChild(lemmaCell);
                    tableRow.appendChild(meaningCell);

                    tableBody.appendChild(tableRow);
                });
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voca-Core 9: 전체 단어 목록 (표 형식)</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --background-color: #f4f4f9;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--dark-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

       .app-container {
            width: 100%;
            max-width: 700px; /* 표 형식은 조금 더 넓게 */
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--primary-color);
            margin-bottom: 0.25rem;
        }
         header p {
             color: var(--secondary-color);
             font-size: 0.9rem;
         }

        /* 표 스타일 */
       .word-table-container {
            width: 100%;
            margin-bottom: 1.5rem;
            /* max-height: 500px; */ /* 스크롤 필요 시 주석 해제 */
            /* overflow-y: auto; */ /* 스크롤 필요 시 주석 해제 */
        }

        table {
            width: 100%;
            border-collapse: collapse; /* 테두리 겹침 제거 */
        }

        th, td {
            border: 1px solid #dee2e6; /* 셀 테두리 */
            padding: 0.75rem;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background-color: var(--light-color);
            font-weight: 600;
            position: sticky; /* 헤더 고정 (스크롤 시) */
            top: 0; /* 헤더 고정 (스크롤 시) */
        }

        td:first-child { /* 첫 번째 열 (스페인어) */
            color: var(--primary-color);
            font-weight: 500;
            width: 40%; /* 너비 조정 */
        }
         td:last-child { /* 두 번째 열 (한국어 뜻) */
             color: var(--dark-color);
             width: 60%; /* 너비 조정 */
         }

         /* 홀수/짝수 행 배경색 */
         tbody tr:nth-child(odd) {
             background-color: #f8f9fa;
         }
         tbody tr:hover {
             background-color: #e9ecef; /* 마우스 오버 효과 */
         }


       .navigation-button {
            display: inline-block; /* 버튼 크기 내용에 맞게 */
            width: auto; /* 버튼 크기 내용에 맞게 */
            padding: 0.8rem 1.5rem; /* 버튼 패딩 조정 */
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background-color: var(--success-color);
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s ease;
            margin-top: 1rem; /* 위쪽 여백 */
        }
       .navigation-button:hover {
            background-color: #218838;
        }

       .loading-message {
           text-align: center;
           color: var(--secondary-color);
           padding: 2rem;
       }
        /* 버튼 정렬용 컨테이너 */
       .button-container {
           text-align: center;
       }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Voca-Core 9: 전체 단어 목록</h1>
            <p>총 45개의 스페인어 단어입니다.</p>
        </header>

        <div class="word-table-container">
            <table>
                <thead>
                    <tr>
                        <th>스페인어 (Lemma)</th>
                        <th>한국어 뜻</th>
                    </tr>
                </thead>
                <tbody id="word-table-body">
                    <tr>
                        <td colspan="2" class="loading-message">단어 목록 로딩 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="button-container">
             <a href="index.html" class="navigation-button">Voca-Core 9 빈출 순서 학습 시작하기 &rarr;</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.getElementById('word-table-body');
            let allWords = [];

            try {
                // 스페인어.txt 파일 로드
                const response = await fetch('스페인어.txt');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                allWords = await response.json();

                // 선택: 알파벳 순 정렬 (필요 없으면 이 줄 주석 처리)
                allWords.sort((a, b) => a.lemma.localeCompare(b.lemma, 'es'));

                renderWordTable();

            } catch (error) {
                console.error("단어 데이터 로딩 실패:", error);
                tableBody.innerHTML = `<tr><td colspan="2" class="loading-message">단어 파일을 불러오는 데 실패했습니다.<br>'스페인어.txt' 파일이 같은 폴더에 있는지 확인해주세요.</td></tr>`;
            }

            // 단어 테이블을 화면에 렌더링하는 함수
            function renderWordTable() {
                tableBody.innerHTML = ''; // 기존 내용 초기화
                if (allWords.length === 0) {
                     tableBody.innerHTML = `<tr><td colspan="2" class="loading-message">표시할 단어가 없습니다.</td></tr>`;
                     return;
                }

                allWords.forEach(word => {
                    const tableRow = document.createElement('tr');

                    const lemmaCell = document.createElement('td');
                    lemmaCell.textContent = word.lemma;

                    const meaningCell = document.createElement('td');
                    meaningCell.textContent = word.korean_meaning;

                    tableRow.appendChild(lemmaCell);
                    tableRow.appendChild(meaningCell);

                    tableBody.appendChild(tableRow);
                });
            }
        });
    </script>

</body>
</html>
